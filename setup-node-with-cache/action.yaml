# Installs Node.js and a package manager, restores the dependency cache keyed on
# the lockfile, and runs a frozen-lockfile install. Optionally authenticates to
# a private npm registry and applies patch-package patches.

name: "Setup Node.js with Cache"
description: "Installs Node.js and npm, yarn, or pnpm, restores the dependency cache, and installs dependencies from the lockfile"

inputs:
  node-version:
    description: "Node.js release to install (example: 26)."
    required: false
    default: "26"
  package-manager:
    description: "Package manager to use: npm, yarn, or pnpm. When empty, detected from the packageManager field in package.json, then from the lockfile in working-directory."
    required: false
    default: ""
  package-manager-version:
    description: "Release of the package manager (example: 11.25.0). \"latest\" uses the version pinned by the packageManager field in package.json when there is one, otherwise the newest available."
    required: false
    default: "latest"
  working-directory:
    description: "Directory that contains package.json and the lockfile. Use this for monorepo packages."
    required: false
    default: "."
  patch-package:
    description: "Run patch-package after the install. Requires patch-package in devDependencies and a patches directory."
    required: false
    default: "false"
  registry-token:
    description: "Auth token for a private npm registry. When empty, no registry authentication is configured."
    required: false
    default: ""
  registry-scope:
    description: "npm scope(s) to resolve from the private registry (example: @acme). Accepts a comma- or space-separated list. Only applied when registry-token is also set."
    required: false
    default: ""
  registry-host:
    description: "Hostname of the private npm registry, without protocol or trailing slash."
    required: false
    default: "npm.pkg.github.com"

outputs:
  package-manager:
    description: "The package manager that was used: npm, yarn, or pnpm."
    value: ${{ steps.opts.outputs.manager }}
  cache-hit:
    description: "Whether the dependency cache was restored (\"true\" or \"false\")."
    value: ${{ steps.node.outputs.cache-hit }}
  node-version:
    description: "The Node.js version that was installed."
    value: ${{ steps.node.outputs.node-version }}

runs:
  using: composite
  steps:
    # Resolve the package manager, in order of precedence: the package-manager
    # input, the packageManager field in package.json, then whichever lockfile
    # is present. A version of "latest" defers to the packageManager field so
    # the action never contradicts a pin the repository already carries.
    # Inputs always carry their defaults, but a caller can pass an empty string
    # (for example from an unset variable), so every fallback is explicit.
    - id: opts
      name: Resolve options
      shell: bash
      env:
        RAW_NODE: ${{ inputs.node-version }}
        RAW_MANAGER: ${{ inputs.package-manager }}
        RAW_MANAGER_VERSION: ${{ inputs.package-manager-version }}
        RAW_PROJECT_DIR: ${{ inputs.working-directory }}
        RAW_PATCH: ${{ inputs.patch-package }}
      run: |
        project_dir="${RAW_PROJECT_DIR:-.}"
        if [ ! -f "$project_dir/package.json" ]; then
          echo "::error::No package.json in working-directory '$project_dir'."
          exit 1
        fi

        # "pnpm@11.25.0+sha512..." -> manager "pnpm", version "11.25.0"
        field_spec="$(sed -n 's/.*"packageManager"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$project_dir/package.json" | head -n 1)"
        field_spec="${field_spec%%+*}"
        field_manager="${field_spec%%@*}"
        field_version=""
        [ "$field_spec" = "$field_manager" ] || field_version="${field_spec#*@}"

        if [ -n "$RAW_MANAGER" ]; then
          manager="$RAW_MANAGER"
          source="the package-manager input"
        elif [ -n "$field_manager" ]; then
          manager="$field_manager"
          source="the packageManager field in package.json"
        else
          found=""
          [ -f "$project_dir/pnpm-lock.yaml" ] && found="$found pnpm"
          [ -f "$project_dir/yarn.lock" ] && found="$found yarn"
          { [ -f "$project_dir/package-lock.json" ] || [ -f "$project_dir/npm-shrinkwrap.json" ]; } && found="$found npm"
          set -- $found
          case $# in
            1)
              manager="$1"
              source="the lockfile in '$project_dir'"
              ;;
            0)
              echo "::error::No lockfile found in '$project_dir'. Commit one, add a packageManager field to package.json, or set the package-manager input."
              exit 1
              ;;
            *)
              echo "::error::Found lockfiles for$found in '$project_dir'. Set the package-manager input to choose one."
              exit 1
              ;;
          esac
        fi

        case "$manager" in
          npm|yarn|pnpm) ;;
          *)
            echo "::error::Unsupported package manager '$manager' (from $source). Use npm, yarn, or pnpm."
            exit 1
            ;;
        esac

        version="${RAW_MANAGER_VERSION:-latest}"
        if [ "$version" = "latest" ] && [ "$manager" = "$field_manager" ] && [ -n "$field_version" ]; then
          version="$field_version"
          echo "Using $manager@$version from $source, version pinned by packageManager in package.json"
        else
          echo "Using $manager@$version from $source"
        fi

        emit() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
        emit node            "${RAW_NODE:-26}"
        emit manager         "$manager"
        emit manager_version "$version"
        emit project_dir     "$project_dir"
        emit patch           "${RAW_PATCH:-false}"

    - name: Warn about unauthenticated scope
      if: inputs.registry-token == '' && inputs.registry-scope != ''
      shell: bash
      run: echo "::warning::registry-scope was provided but registry-token is empty; skipping private registry authentication"

    - name: Write registry credentials
      if: inputs.registry-token != ''
      shell: bash
      env:
        TOKEN: ${{ inputs.registry-token }}
        SCOPES: ${{ inputs.registry-scope }}
        HOST: ${{ inputs.registry-host }}
      run: |
        host="${HOST#https://}"
        host="${host#http://}"
        host="${host%/}"
        echo "//${host}/:_authToken=${TOKEN}" >> "${HOME}/.npmrc"
        for scope in ${SCOPES//,/ }; do
          echo "@${scope#@}:registry=https://${host}/" >> "${HOME}/.npmrc"
        done

    # pnpm must exist before setup-node runs, because setup-node's cache
    # support shells out to it to locate the store.
    - name: Provision pnpm
      if: steps.opts.outputs.manager == 'pnpm'
      uses: pnpm/action-setup@v6
      with:
        version: ${{ steps.opts.outputs.manager_version }}
        run_install: false

    - id: node
      name: Provision Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ steps.opts.outputs.node }}
        cache: ${{ steps.opts.outputs.manager }}
        cache-dependency-path: |
          ${{ steps.opts.outputs.project_dir }}/**/package-lock.json
          ${{ steps.opts.outputs.project_dir }}/**/yarn.lock
          ${{ steps.opts.outputs.project_dir }}/**/pnpm-lock.yaml

    # Node 25 and later no longer bundle corepack, so install it on demand.
    - name: Provision yarn
      if: steps.opts.outputs.manager == 'yarn'
      shell: bash
      env:
        WANTED: ${{ steps.opts.outputs.manager_version }}
      run: |
        command -v corepack >/dev/null 2>&1 || npm install --global corepack
        corepack enable
        spec="yarn@${WANTED}"
        [ "$WANTED" != "latest" ] || spec="yarn@stable"
        corepack prepare "$spec" --activate

    - name: Provision npm
      if: steps.opts.outputs.manager == 'npm'
      shell: bash
      env:
        WANTED: ${{ steps.opts.outputs.manager_version }}
      run: npm install --global "npm@${WANTED}"

    - name: Install dependencies
      shell: bash
      working-directory: ${{ steps.opts.outputs.project_dir }}
      env:
        MANAGER: ${{ steps.opts.outputs.manager }}
      # On Linux, give Node three quarters of the machine's memory so large
      # installs don't hit the default heap limit.
      run: |
        echo "Installing dependencies using ${MANAGER}"

        if [ -r /proc/meminfo ]; then
          mem_kb=$(sed -n 's/^MemTotal:[[:space:]]*\([0-9]*\).*/\1/p' /proc/meminfo)
          mem_mb=$(( mem_kb / 1024 ))
          export NODE_OPTIONS="--max-old-space-size=$(( mem_mb * 3 / 4 ))"
          echo "NODE_OPTIONS=${NODE_OPTIONS}"
        fi

        case "$MANAGER" in
          pnpm)
            pnpm install --frozen-lockfile
            ;;
          yarn)
            # Yarn 1 uses --frozen-lockfile; Yarn 2 and later use --immutable.
            case "$(yarn --version)" in
              1.*) yarn install --frozen-lockfile ;;
              *)   yarn install --immutable ;;
            esac
            ;;
          npm)
            npm ci
            ;;
        esac

    - name: Run patch-package
      if: steps.opts.outputs.patch == 'true'
      shell: bash
      working-directory: ${{ steps.opts.outputs.project_dir }}
      run: npx patch-package
