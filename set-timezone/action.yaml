# Cross-platform timezone setter for GitHub Actions runners.
# Based on the idea behind https://github.com/szenius/set-timezone, reimplemented.

name: "Set Timezone 🕐"
description: "Configures the runner's system timezone on Linux, macOS, and Windows"

inputs:
  timezone-linux:
    description: "IANA timezone name applied on Linux runners (example: America/New_York)."
    required: false
    default: "UTC"
  timezone-macos:
    description: "IANA timezone name applied on macOS runners (example: Europe/Berlin)."
    required: false
    default: "GMT"
  timezone-windows:
    description: "Windows timezone identifier applied on Windows runners (example: Eastern Standard Time). Run `tzutil /l` to see the valid list."
    required: false
    default: "UTC"

runs:
  using: composite
  steps:
    - name: Apply timezone on Linux
      if: runner.os == 'Linux'
      shell: bash
      env:
        TARGET_TZ: ${{ inputs.timezone-linux }}
      # Preferred path is timedatectl, but it depends on systemd and polkit.
      # Inside containers and on some self-hosted machines it fails with
      # "Failed to set time zone: Access denied". When that happens, replicate
      # what timedatectl would have done: point /etc/localtime at the zoneinfo
      # file and record the name in /etc/timezone.
      run: |
        as_root() {
          if [ "$(id -u)" = "0" ]; then
            "$@"
          else
            sudo "$@"
          fi
        }

        if ! as_root timedatectl set-timezone "$TARGET_TZ" 2>/dev/null; then
          zone_file="/usr/share/zoneinfo/$TARGET_TZ"

          if [ ! -e "$zone_file" ]; then
            echo "::error::Invalid timezone '$TARGET_TZ'. List valid names with: timedatectl list-timezones"
            exit 1
          fi

          as_root ln -sf "$zone_file" /etc/localtime
          printf '%s\n' "$TARGET_TZ" | as_root tee /etc/timezone >/dev/null
        fi

    - name: Apply timezone on macOS
      if: runner.os == 'macOS'
      shell: bash
      env:
        TARGET_TZ: ${{ inputs.timezone-macos }}
      # systemsetup returns 0 regardless of outcome, and on recent macOS it
      # intermittently logs "### Error:-99 ... InternetServices.m" and leaves
      # the zone unchanged. So... validate the name against the zoneinfo
      # database up front, retry systemsetup while confirming the result via
      # the /etc/localtime symlink it maintains, and if it keeps failing,
      # write that symlink directly.
      run: |
        zone_file="/var/db/timezone/zoneinfo/$TARGET_TZ"

        if [ ! -e "$zone_file" ]; then
          echo "::error::Invalid timezone '$TARGET_TZ'. List valid names with: sudo systemsetup -listtimezones"
          exit 1
        fi

        applied() {
          [ "$(readlink -f /etc/localtime 2>/dev/null)" = "$(readlink -f "$zone_file")" ]
        }

        for attempt in 1 2 3 4 5; do
          sudo systemsetup -settimezone "$TARGET_TZ" || true
          if applied; then
            exit 0
          fi
          echo "systemsetup attempt $attempt did not apply '$TARGET_TZ' ($(sudo systemsetup -gettimezone)); retrying"
          sleep 2
        done

        echo "systemsetup kept failing; pointing /etc/localtime at $zone_file directly"
        sudo ln -sfn "$zone_file" /etc/localtime

        if ! applied; then
          echo "::error::Failed to set macOS timezone to '$TARGET_TZ' ($(sudo systemsetup -gettimezone))"
          exit 1
        fi

    - name: Apply timezone on Windows
      if: runner.os == 'Windows'
      # pwsh rather than bash: Git Bash rewrites the "/s" switch into the
      # drive path "S:/" before tzutil sees it.
      shell: pwsh
      env:
        TARGET_TZ: ${{ inputs.timezone-windows }}
      run: tzutil /s "$env:TARGET_TZ"

    - name: Show resulting time
      shell: bash
      run: |
        printf 'Timezone set. Current time: %s\n' "$(date)"
